<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1E1E1E; }
  .CodeMirror { height:100%; font-size:14px; font-family: 'Menlo','Consolas',monospace; }
  .CodeMirror-hints { background:#252526; border:1px solid #3C3C3C; color:#D4D4D4; }
  .CodeMirror-hint-active { background:#0E639C !important; color:#fff !important; }
</style>
</head>
<body>
<textarea id="code"></textarea>
<script>
  var cm = CodeMirror.fromTextArea(document.getElementById('code'), {
    lineNumbers: true,
    mode: 'htmlmixed',
    theme: 'material-darker',
    lineWrapping: true,
    autoCloseTags: true,
    autoCloseBrackets: true,
    indentUnit: 2,
    tabSize: 2,
    extraKeys: {
      "Ctrl-Space": "autocomplete",
      "Tab": function(cm) {
        if (cm.somethingSelected()) cm.indentSelection('add');
        else cm.replaceSelection("  ");
      }
    }
  });

  // ===== DANH SÁCH THẺ HTML GỢI Ý =====
  var TAG_HINTS = [
    { text: '<html>', displayText: '<html> → chèn khung trang đầy đủ (DOCTYPE, head, body)' },
    { text: '<head>', displayText: '<head>' },
    { text: '<body>', displayText: '<body>' },
    { text: '<title>', displayText: '<title>' },
    { text: '<meta>', displayText: '<meta charset="UTF-8">' },
    { text: '<link>', displayText: '<link rel="stylesheet">' },
    { text: '<script>', displayText: '<script>' },
    { text: '<style>', displayText: '<style>' },
    { text: '<div>', displayText: '<div>' },
    { text: '<span>', displayText: '<span>' },
    { text: '<p>', displayText: '<p>' },
    { text: '<h1>', displayText: '<h1>' },
    { text: '<h2>', displayText: '<h2>' },
    { text: '<h3>', displayText: '<h3>' },
    { text: '<a>', displayText: '<a href="">' },
    { text: '<img>', displayText: '<img src="" alt="">' },
    { text: '<ul>', displayText: '<ul>' },
    { text: '<ol>', displayText: '<ol>' },
    { text: '<li>', displayText: '<li>' },
    { text: '<table>', displayText: '<table>' },
    { text: '<tr>', displayText: '<tr>' },
    { text: '<td>', displayText: '<td>' },
    { text: '<th>', displayText: '<th>' },
    { text: '<form>', displayText: '<form>' },
    { text: '<input>', displayText: '<input type="text">' },
    { text: '<button>', displayText: '<button>' },
    { text: '<textarea>', displayText: '<textarea>' },
    { text: '<select>', displayText: '<select>' },
    { text: '<option>', displayText: '<option>' },
    { text: '<label>', displayText: '<label>' },
    { text: '<header>', displayText: '<header>' },
    { text: '<footer>', displayText: '<footer>' },
    { text: '<nav>', displayText: '<nav>' },
    { text: '<section>', displayText: '<section>' },
    { text: '<article>', displayText: '<article>' },
    { text: '<br>', displayText: '<br>' },
    { text: '<hr>', displayText: '<hr>' },
    { text: '<strong>', displayText: '<strong>' },
    { text: '<em>', displayText: '<em>' }
  ];

  // Gợi ý thẻ khi gõ '<'
  function htmlTagHint(cmInstance) {
    var cur = cmInstance.getCursor();
    var line = cmInstance.getLine(cur.line);
    var start = cur.ch;
    while (start > 0 && /[\w-]/.test(line.charAt(start - 1))) start--;
    // Gộp cả dấu '<' vào vùng thay thế để không sinh ra '<<html>'
    if (start > 0 && line.charAt(start - 1) === '<') start--;
    var prefix = line.slice(start, cur.ch).toLowerCase();
    var list = TAG_HINTS.filter(function(h) {
      return h.text.toLowerCase().indexOf(prefix) === 0;
    });
    return {
      list: list.length ? list : TAG_HINTS.slice(0, 12),
      from: CodeMirror.Pos(cur.line, start),
      to: CodeMirror.Pos(cur.line, cur.ch)
    };
  }

  // Bật autocomplete tự động khi gõ
  cm.on('inputRead', function(cmInstance, change) {
    var typed = change.text[0];
    if (typed === '<') {
      cmInstance.showHint({ hint: htmlTagHint, completeSingle: false });
    } else if (/[a-zA-Z]/.test(typed)) {
      // Gợi ý tiếp khi đang gõ tên thẻ sau '<'
      var cur = cmInstance.getCursor();
      var line = cmInstance.getLine(cur.line).slice(0, cur.ch);
      var lt = line.lastIndexOf('<');
      if (lt >= 0 && line.indexOf('>', lt) === -1) {
        cmInstance.showHint({ hint: htmlTagHint, completeSingle: false });
      }
    }
  });

  // ===== TỰ ĐỘNG CHÈN KHUNG HTML ĐẦY ĐỦ KHI GÕ <html> =====
  var HTML_SKELETON = '<!DOCTYPE html>\n<html>\n<head>\n<title>Tên Của Trang Web</title>\n</head>\n<body>\n<p>Nội Dung Của Trang Web</p>\n</body>\n</html>';

  // Thay toàn bộ tài liệu bằng khung mẫu và đặt con trỏ vào tên trang
  function insertHtmlSkeleton(cmInstance, startLine) {
    cmInstance.replaceRange(
      HTML_SKELETON,
      CodeMirror.Pos(0, 0),
      CodeMirror.Pos(cmInstance.lastLine(), cmInstance.getLine(cmInstance.lastLine()).length),
      '+skeleton'
    );
    var tIdx = HTML_SKELETON.indexOf('Tên Của Trang Web');
    if (tIdx >= 0) {
      var upto = HTML_SKELETON.slice(0, tIdx);
      var ls = upto.split('\n');
      // Đưa con trỏ vào ngay giữa "Tên Của Trang Web" để sửa luôn
      cmInstance.setCursor(CodeMirror.Pos(ls.length - 1, ls[ls.length - 1].length));
    }
    cmInstance.focus();
  }

  cm.on('change', function(cmInstance, change) {
    if (change.origin === 'setValue' || change.origin === '+skeleton') return;
    var typed = change.text ? change.text.join('') : '';
    // Chỉ xử lý khi người dùng vừa gõ ký tự '>'
    if (typed.indexOf('>') === -1) return;
    // Chờ autoCloseTags xử lý xong rồi mới kiểm tra
    setTimeout(function() {
      var cur = cmInstance.getCursor();
      var lineText = cmInstance.getLine(cur.line).slice(0, cur.ch);
      // Dòng bắt đầu bằng <html> (kể cả khi đã bị auto-close thêm </html>)
      if (/^\s*<html>/i.test(lineText)) {
        var full = cmInstance.getValue();
        // Chỉ chèn nếu tài liệu chưa phải một trang HTML hoàn chỉnh
        if (full.toLowerCase().indexOf('<!doctype') === -1) {
          insertHtmlSkeleton(cmInstance);
        }
      }
    }, 10);
  });

  // Đặt nội dung từ app truyền vào
  window.setCode = function(value, mode) {
    cm.setOption('mode', mode || 'htmlmixed');
    cm.setValue(value || '');
  };

  // Lấy nội dung ra để app đọc
  window.getCode = function() {
    return cm.getValue();
  };

  // Lắng nghe thay đổi -> báo lên app để auto-save
  cm.on('change', function() {
    if (window.AndroidBridge && window.AndroidBridge.onCodeChanged) {
      window.AndroidBridge.onCodeChanged(cm.getValue());
    }
  });
</script>
</body>
</html>
