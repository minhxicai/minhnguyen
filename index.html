<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: tràn viền trên máy có tai thỏ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Đồng hồ giờ Việt Nam (GMT+7) kèm bấm giờ và hẹn giờ">

  <!-- Cho phép chạy toàn màn hình khi thêm vào màn hình chính -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Đồng Hồ VN">

  <title>Đồng Hồ Việt Nam</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Tiêu đề -->
    <header class="app-header">
      <h1>Đồng Hồ Việt Nam</h1>
      <p class="subtitle">Múi giờ <strong>Asia/Ho_Chi_Minh</strong> · GMT+7</p>
    </header>

    <!-- Thanh công cụ: bật thông báo / thử chuông -->
    <div class="toolbar">
      <button class="tool-btn" id="btn-notify">🔔 Bật thông báo</button>
      <button class="tool-btn" id="btn-test-sound">🔊 Thử chuông</button>
    </div>

    <!-- Thanh chuyển tab -->
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="clock" role="tab">Đồng hồ</button>
      <button class="tab" data-tab="stopwatch" role="tab">Bấm giờ</button>
      <button class="tab" data-tab="timer" role="tab">Hẹn giờ</button>
    </nav>

    <!-- ===== TAB 1: ĐỒNG HỒ ===== -->
    <section id="panel-clock" class="panel active">
      <div class="card clock-card">
        <div class="clock-time" id="clock-time">--:--:--</div>
        <div class="clock-date" id="clock-date">Đang tải...</div>
        <div class="clock-badge" id="clock-badge">Giờ Việt Nam (GMT+7)</div>
      </div>
    </section>

    <!-- ===== TAB 2: BẤM GIỜ ===== -->
    <section id="panel-stopwatch" class="panel">
      <div class="card">
        <div class="big-display" id="sw-display">00:00:00<span class="frac">.00</span></div>
        <div class="btn-row">
          <button class="btn btn-primary" id="sw-start">Bắt đầu</button>
          <button class="btn btn-ghost" id="sw-lap" disabled>Vòng</button>
          <button class="btn btn-danger" id="sw-reset" disabled>Đặt lại</button>
        </div>
      </div>
      <div class="card">
        <h2 class="card-title">Danh sách vòng</h2>
        <ul class="lap-list" id="sw-laps">
          <li class="empty">Chưa có vòng nào</li>
        </ul>
      </div>
    </section>

    <!-- ===== TAB 3: HẸN GIỜ ===== -->
    <section id="panel-timer" class="panel">
      <div class="card">
        <div class="big-display" id="tm-display">00:00:00</div>

        <div class="inputs" id="tm-inputs">
          <label>Giờ<input type="number" id="tm-h" min="0" max="99" value="0" inputmode="numeric"></label>
          <label>Phút<input type="number" id="tm-m" min="0" max="59" value="5" inputmode="numeric"></label>
          <label>Giây<input type="number" id="tm-s" min="0" max="59" value="0" inputmode="numeric"></label>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="tm-start">Bắt đầu</button>
          <button class="btn btn-danger" id="tm-reset">Đặt lại</button>
        </div>

        <div class="presets">
          <button class="chip" data-sec="60">1 phút</button>
          <button class="chip" data-sec="300">5 phút</button>
          <button class="chip" data-sec="600">10 phút</button>
          <button class="chip" data-sec="1500">25 phút</button>
        </div>

        <p class="hint" id="tm-hint">Giữ màn hình sáng khi đang chạy</p>
      </div>
    </section>

    <footer class="app-footer">
      <span id="footer-tz">GMT+7</span>
    </footer>
  </div>

  <!-- Thông báo nổi (toast) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
